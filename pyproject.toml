[project]
name = "opentts"
version = "0.1.0"
description = "Local PDF read-aloud app with neural voices (Kokoro) and layout-aware skipping of figures/tables"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "kokoro-onnx>=0.4.9",
    "numpy",
    "doclayout-yolo>=0.0.4",
    "huggingface_hub",
]
